server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Attachments are capped at 10 MB; headroom covers multipart framing. The
    # backend re-validates the real limit. On overflow nginx answers with an
    # HTML 413 page, so the client must handle that response type too.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # The Mini App runs inside a WebView on the app domain, so the session
    # cookie must be forwarded both for same-origin calls and for image
    # subrequests such as `<img src="/api/v1/files/...">`.
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;

    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        # Longer timeouts for background computations and notifications.
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Stream uploads straight to the backend instead of buffering the whole
        # file on disk first; the backend forwards them to dufs.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable caching for static frontend assets (JS, CSS, fonts).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}