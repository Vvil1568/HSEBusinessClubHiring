        Видимость:
          - без `ownerId` скрытые вакансии (`isHidden: true`) не возвращаются;
          - `ownerId=me` (или UUID текущего пользователя) возвращает вакансии **только его стартапов**,
            включая скрытые. Это единственный эндпойнт, поддерживающий сентинел `me`.

        Поиск (`search`) ищет по названию стартапа, `requirements` и `reward`
        (намеренно **не** по `description`).

        `titles` — повторяемый параметр или строка через запятую; сравнение точное, без учёта регистра.
