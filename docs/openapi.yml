  # ─────────────────────────────────────────────────────────────────────────────
  # Files
  # ─────────────────────────────────────────────────────────────────────────────
  /files/upload:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Загрузить файл в хранилище
      description: |
        Принимает `multipart/form-data` с двумя полями:
          - `scope` — политика хранения и валидации;
          - `file` — бинарные данные.

        Backend:
          - генерирует UUID как ключ объекта (имя файла — только метаданные);
          - валидирует размер и MIME согласно `scope`;
          - стримит тело в dufs (`PUT`) без полной буферизации;
          - возвращает `url` вида `/api/v1/files/{uuid}` — **через прокси**, не прямой адрес dufs.

        Лимиты:
          | scope | размер | MIME |
          |---|---|---|
          | `startup-logo` | ≤ 2 МБ | `image/png`, `image/jpeg`, `image/webp`, `image/gif`, `image/svg+xml` |
          | `application-attachment` | ≤ 10 МБ | любой |

        Клиент показывает прогресс из XHR-событий, поэтому ответ должен отдаваться только после
        полной записи объекта в хранилище. Загрузка прерывается клиентом через `AbortSignal`
        (закрытие модального окна, `api.post` с `signal`) — backend обязан прервать `PUT` в dufs
        и не оставлять «полуобъект».

        Объект записывается в индекс (`files`) с `uploaded_by_id = current_user`, поэтому логотип
        впоследствии принимается только от загрузившего его пользователя.
      x-frontend:
        hook: useFileUpload
        file: frontend/src/features/files/api/useFiles.ts
        component: LogoUploader / ApplyModal
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [scope, file]
              properties:
                scope:
                  $ref: '#/components/schemas/FileUploadScope'
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
            examples:
              logo:
                summary: Логотип стартапа
                value:
                  scope: startup-logo
                  file: (binary)
              attachment:
                summary: Вложение к отклику
                value:
                  scope: application-attachment
                  file: (binary)
      responses:
        '201':
          description: Объект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
              examples:
                stored:
                  summary: Сохранённый логотип
                  value:
                    id: 6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
                    name: neuropilot-logo.png
                    size: 48120
                    mimeType: image/png
                    url: /api/v1/files/6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
                    createdAt: '2026-10-20T21:00:00.000Z'
        '400':
          description: Тело не является `multipart/form-data`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notMultipart:
                  value:
                    message: Ожидается multipart/form-data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Файл отсутствует, пустой, слишком большой или недопустимый MIME
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    message: Файл больше 2 МБ
                wrongType:
                  value:
                    message: 'Логотип должен быть изображением PNG, JPG, WEBP, GIF или SVG'
                missing:
                  value:
                    message: Файл не передан
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        description: UUID объекта в хранилище (не имя файла).
        schema:
          type: string
          format: uuid
        example: 6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Скачать/отобразить файл
      description: |
        Отдаёт байты объекта с его исходным MIME-типом. Используется:
          - как `src` в `<img>` для логотипов стартапов;
          - для скачивания вложений (`responseType: 'blob'`, затем сохранение под исходным именем).

        **Авторизация здесь только cookie (`hb_session`).** Браузер запрашивает изображение без
        участия JS, поэтому `X-Telegram-Init-Data` в этом запросе отсутствует. Если backend
        потребует заголовок, все логотипы перестанут отображаться. Альтернатива, если cookie
        недоступна — короткоживущий подписанный URL (`?token=...`, ≤ 5 минут), который backend
        возвращает в `url`/`logoUrl`.

        Аватары пользователей (`photoUrl`) этот прокси не используют: это ссылка на CDN Telegram.
      x-frontend:
        hook: useFileSrc / useDownloadFile
        file: frontend/src/features/files/api/useFiles.ts
      responses:
        '200':
          description: Бинарное содержимое объекта
          headers:
            Content-Type:
              description: Исходный MIME-тип файла.
              schema:
                type: string
              example: image/png
            Content-Length:
              description: Размер в байтах.
              schema:
                type: integer
              example: 48120
            Content-Disposition:
              description: |
                `inline` для изображений; для вложений — `attachment; filename*=UTF-8''<original>`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: |
            Нет cookie-сессии (или подписанный URL истёк). Для `<img>` это означает «не удалось
            загрузить изображение».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noSession:
                  value:
                    message: Требуется авторизация
        '403':
          description: Объект принадлежит другому пользователю (например, вложение чужого отклика)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notOwned:
                  value:
                    message: Нет доступа к этому файлу
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Метаданные есть, содержимое недоступно (только демо-режим)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                gone:
                  value:
                    message: Содержимое файла доступно только в текущей сессии

    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Удалить файл
      description: |
        Удаляет объект из хранилища и индекс. Вызывается, когда пользователь убирает загруженный
        логотип или вложение до сохранения формы, чтобы не копить «сиротские» UUID.

        Удалять может только владелец объекта (`files.uploaded_by_id`); для системных объектов
        (`uploaded_by_id IS NULL`) удаление запрещено.

        Удаление идемпотентно по смыслу: повторный вызов возвращает `404`, клиент трактует
        ошибку как «файла уже нет» и продолжает работу.
      x-frontend:
        hook: useDeleteFile
        file: frontend/src/features/files/api/useFiles.ts
      responses:
        '200':
          description: Объект удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
              examples:
                deleted:
                  value:
                    deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data
      description: |
        Сырая строка `Telegram.WebApp.initData` (query-string формат, `hash` в конце), без
        перекодирования. Backend проверяет HMAC-SHA256 с `TELEGRAM_BOT_TOKEN` (ключ
        `WebAppData`), свежесть `auth_date` и однократность подписи (`hash`).

        Заголовок отправляется на каждый запрос, потому что `initData` перевыпускается при
        каждом запуске Mini App. Значение `initDataUnsafe` доверенным не считается и на сервер
        не отправляется.

    sessionCookie:
      type: apiKey
      in: cookie
      name: hb_session
      description: |
        HttpOnly-сессия, выданная `POST /auth/telegram` после проверки `initData`
        (`Secure; SameSite=Lax; Path=/`).

        Нужна для запросов, которые браузер делает без участия JS — прежде всего
        `<img src="/api/v1/files/{uuid}">` для логотипов, и для скачивания вложений.
        Без cookie такие запросы получают `401`, и изображения не отображаются.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1. Неположительные значения → 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Размер страницы. Значение по умолчанию зависит от эндпойнта (6 или 10); максимум — 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 6
      example: 8

    StartupId:
      name: startupId
      in: path
      required: true
      description: |
        Идентификатор стартапа. Непрозрачная строка: сервер отдаёт UUID, а демо-данные
        используют читаемые значения (`s-1`), поэтому `format: uuid` не навязывается.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: s-1

    VacancyId:
      name: vacancyId
      in: path
      required: true
      description: Идентификатор вакансии (непрозрачная строка, см. `StartupId`).
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: v-1

  responses:
    Unauthorized:
      description: Пользователь не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                message: Требуется авторизация

    Forbidden:
      description: Недостаточно прав (не владелец ресурса)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notOwner:
              value:
                message: Недостаточно прав для изменения этого стартапа

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            startupNotFound:
              value:
                message: Стартап не найден
            vacancyNotFound:
              value:
                message: Вакансия не найдена
            fileNotFound:
              value:
                message: Файл не найден

    TooManyRequests:
      description: Слишком много попыток (защита `POST /auth/telegram` и трекинга просмотров)
      headers:
        Retry-After:
          description: Через сколько секунд повторить запрос.
          schema:
            type: integer
          example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            throttled:
              value:
                message: Слишком много запросов, попробуйте позже

    Conflict:
      description: |
        Конфликт состояния. Основной случай — повторный отклик на вакансию
        (уникальный ключ `applications (vacancy_id, applicant_id)`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyApplied:
              value:
                message: Вы уже откликнулись на эту вакансию

    UnprocessableEntity:
      description: Нарушены бизнес-правила или ограничения полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            motivationRequired:
              value:
                message: Добавьте мотивационное письмо
            unknownFile:
              value:
                message: 'Файл «resume.pdf» не найден в хранилище'
            tooManyFiles:
              value:
                message: Можно приложить не больше 5 файлов

    InsufficientStorage:
      description: Общий бюджет хранилища вложений исчерпан
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            full:
              value:
                message: Хранилище файлов переполнено

    ServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            createFailed:
              value:
                message: Не удалось создать стартап

  schemas:
    # ── Общие ──────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Готовый к показу пользователю текст (русский).
          example: Вакансия не найдена

    PaginatedResult:
      type: object
      description: Базовая форма пагинации; конкретные ответы описаны отдельными схемами.
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          description: Общее количество элементов до пагинации.
          example: 21
        page:
          type: integer
          description: Текущая страница (1-based).
          example: 1
        pageSize:
          type: integer
          description: Размер страницы, применённый сервером.
          example: 6

    Applicant:
      type: object
      description: |
        Пользователь как он приходит из Telegram. Платформа не хранит собственный ник,
        email, должность или компанию — эти поля удалены из модели целиком.
      required: [id, telegramId, firstName, lastName, photoUrl]
      properties:
        id:
          type: string
          description: Внутренний идентификатор платформы (UUID).
          example: u-anna
        telegramId:
          type: integer
          format: int64
          description: Telegram user id; естественный ключ, по нему выполняется upsert.
          example: 279058397
        firstName:
          type: string
          maxLength: 100
          description: '`first_name` из Telegram.'
          example: Анна
        lastName:
          type: string
          maxLength: 100
          description: |
            `last_name` из Telegram. Пустая строка, если пользователь не указал фамилию
            (поле в Telegram необязательное); `null` не используется.
          example: Смирнова
        photoUrl:
          type: string
          nullable: true
          description: |
            `photo_url` из Telegram: абсолютная ссылка на CDN Telegram. Не проксируется через
            файловое хранилище и не требует cookie; `null`, если аватар не установлен.
          example: https://t.me/i/userpic/320/anna.jpg

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/Applicant'
        - type: object
          required: [startupsCount, vacanciesCount, applicationsCount]
          properties:
            startupsCount:
              type: integer
              minimum: 0
              example: 1
            vacanciesCount:
              type: integer
              minimum: 0
              example: 3
            applicationsCount:
              type: integer
              minimum: 0
              example: 2

    TelegramSession:
      type: object
      description: Результат обмена `initData` на сессию.
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        expiresAt:
          type: string
          format: date-time
          description: |
            Момент истечения cookie `hb_session`. После него любой запрос вернёт `401` и
            приложение потребует перезапуска Mini App.
          example: '2026-10-22T08:00:00.000Z'

    # ── Стартапы ───────────────────────────────────────────────────────────────
    StartupStage:
      type: string
      description: Стадия проекта.
      enum: [idea, mvp, scaling]
      example: mvp

    StartupRef:
      type: object
      description: Краткая ссылка на стартап (в вакансии и списках).
      required: [id, title, logoUrl, stage]
      properties:
        id:
          type: string
          example: s-1
        title:
          type: string
          maxLength: 150
          example: NeuroPilot AI
        logoUrl:
          type: string
          nullable: true
          description: URL логотипа через файловый прокси; `null` означает «логотипа нет».
          example: null
        stage:
          $ref: '#/components/schemas/StartupStage'

    StartupSummary:
      allOf:
        - $ref: '#/components/schemas/StartupRef'
        - type: object
          required:
            [shortDescription, owner, createdAt, updatedAt, vacanciesCount, applicationsCount, viewsCount]
          properties:
            shortDescription:
              type: string
              maxLength: 300
              description: Короткое описание для карточки каталога.
              example: ИИ-ассистент для первичной диагностики в клиниках.
            owner:
              $ref: '#/components/schemas/Applicant'
            createdAt:
              type: string
              format: date-time
              example: '2026-07-16T09:00:00.000Z'
            updatedAt:
              type: string
              format: date-time
              example: '2026-10-18T12:31:00.000Z'
            vacanciesCount:
              type: integer
              minimum: 0
              description: Количество **нескрытых** вакансий.
              example: 3
            applicationsCount:
              type: integer
              minimum: 0
              description: Сумма откликов по всем вакансиям стартапа.
              example: 14
            viewsCount:
              type: integer
              minimum: 0
              description: Сумма просмотров по всем вакансиям стартапа.
              example: 1860

    Startup:
      allOf:
        - $ref: '#/components/schemas/StartupSummary'
        - type: object
          required: [description, vacancies]
          properties:
            description:
              type: string
              description: 'Полное описание; переносы строк значимы (`white-space: pre-line`).'
              example: Помогает врачам первичного звена формировать предварительные гипотезы.
            vacancies:
              type: array
              description: Все вакансии, включая скрытые.
              items:
                $ref: '#/components/schemas/Vacancy'

    VacancyInput:
      type: object
      required: [title, description, requirements, reward, isHidden]
      properties:
        id:
          type: string
          nullable: true
          description: |
            При обновлении стартапа — id существующей вакансии. Отсутствие поля означает создание
            новой вакансии; при создании стартапа поле игнорируется.
          example: v-1
        title:
          type: string
          maxLength: 150
          description: Пустая строка → server-side fallback на название первой вакансии.
          example: ML Engineer
        description:
          type: string
          example: Дообучение моделей обработки клинических текстов.
        requirements:
          type: string
          example: PyTorch, transformers, NLP от 2 лет.
        reward:
          type: string
          maxLength: 255
          example: 'от 250 000 ₽, гибрид, опционы.'
        isHidden:
          type: boolean
          description: Скрытая вакансия видна только владельцу и в его кабинете.
          example: false

    StartupInput:
      type: object
      required: [title, shortDescription, description, logoUrl, stage, vacancies]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
          example: SkillBridge
        shortDescription:
          type: string
          minLength: 1
          maxLength: 300
          example: Менторская платформа для Junior-разработчиков.
        description:
          type: string
          example: Платформа соединяет менторов и джунов.
        logoUrl:
          type: string
          nullable: true
          writeOnly: true
          description: |
            Обязательное поле; передаётся URL объекта, ранее полученный из `POST /files/upload`
            (`/api/v1/files/{uuid}`). Backend извлекает UUID, проверяет, что объект существует,
            имеет `scope = startup-logo` и загружен этим пользователем, и сохраняет ссылку на
            файл. Произвольный внешний URL отклоняется `422` — строки «как есть» не сохраняются.

            `null` — осознанное «без логотипа»: backend не подставляет плейсхолдер и не сохраняет
            прежний логотип.
          example: /api/v1/files/6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
        stage:
          $ref: '#/components/schemas/StartupStage'
        vacancies:
          type: array
          description: Полный целевой набор вакансий стартапа (см. семантику `PUT /startups/{id}`).
          items:
            $ref: '#/components/schemas/VacancyInput'

    StartupPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResult'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StartupSummary'

    # ── Вакансии ───────────────────────────────────────────────────────────────
    Vacancy:
      type: object
      required:
        [
          id,
          startupId,
          title,
          description,
          requirements,
          reward,
          isHidden,
          viewsCount,
          applicationsCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          example: v-1
        startupId:
          type: string
          example: s-1
        title:
          type: string
          maxLength: 150
          example: ML Engineer
        description:
          type: string
          example: Дообучение моделей обработки клинических текстов.
        requirements:
          type: string
          example: PyTorch, transformers, NLP от 2 лет.
        reward:
          type: string
          maxLength: 255
          example: 'от 250 000 ₽, гибрид, опционы.'
        isHidden:
          type: boolean
          example: false
        viewsCount:
          type: integer
          minimum: 0
          description: Уникальные просмотры (пользователь × день).
          example: 940
        applicationsCount:
          type: integer
          minimum: 0
          example: 8
        createdAt:
          type: string
          format: date-time
          example: '2026-07-20T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-18T12:31:00.000Z'

    VacancyListItem:
      type: object
      description: Строка каталога вакансий (денормализованные данные стартапа).
      required:
        [
          id,
          startupId,
          startupTitle,
          startupLogoUrl,
          title,
          applicationsCount,
          viewsCount,
          isHidden,
          createdAt,
        ]
      properties:
        id:
          type: string
          example: v-1
        startupId:
          type: string
          example: s-1
        startupTitle:
          type: string
          example: NeuroPilot AI
        startupLogoUrl:
          type: string
          nullable: true
          example: null
        title:
          type: string
          example: ML Engineer
        applicationsCount:
          type: integer
          minimum: 0
          example: 8
        viewsCount:
          type: integer
          minimum: 0
          example: 940
        isHidden:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-07-20T10:00:00.000Z'

    VacancyDetails:
      allOf:
        - $ref: '#/components/schemas/Vacancy'
        - type: object
          required: [startup, myApplicationStatus, isOwner]
          properties:
            startup:
              $ref: '#/components/schemas/StartupRef'
            myApplicationStatus:
              allOf:
                - $ref: '#/components/schemas/ApplicationStatus'
              nullable: true
              description: Статус отклика текущего пользователя или `null`, если отклика нет.
            isOwner:
              type: boolean
              description: Владеет ли текущий пользователь стартапом этой вакансии.
              example: false

    VacancySort:
      type: string
      description: Режим сортировки каталога вакансий.
      enum: [new, views, applications]
      default: new
      example: new

    VacancyPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResult'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VacancyListItem'

    VacancyTemplate:
      type: object
      description: Заготовка вакансии; `id` — строковый ключ, не UUID.
      required: [id, title, description, requirements, reward]
      properties:
        id:
          type: string
          example: frontend-developer
        title:
          type: string
          maxLength: 150
          example: Frontend Developer
        description:
          type: string
          example: Развитие пользовательских интерфейсов продукта.
        requirements:
          type: string
          example: React, TypeScript, опыт от 2 лет.
        reward:
          type: string
          maxLength: 255
          example: 'от 200 000 ₽, удалённый формат.'

    # ── Отклики ────────────────────────────────────────────────────────────────
    ApplicationStatus:
      type: string
      description: Статус отклика. Новый отклик всегда `pending`.
      enum: [pending, rejected, approved]
      example: pending

    ApplicationFile:
      type: object
      required: [id, name, size]
      properties:
        id:
          type: string
          format: uuid
          description: UUID объекта в хранилище (не имя файла).
          example: 1a7f3f7c-8b1e-4c2e-9f24-2b6d0b1c5e11
        name:
          type: string
          description: Исходное имя файла (только метаданные).
          example: resume.pdf
        size:
          type: integer
          description: Размер в байтах.
          example: 284311
        mimeType:
          type: string
          nullable: true
          example: application/pdf
        url:
          type: string
          nullable: true
          description: URL через файловый прокси; `null` для устаревших демо-записей.
          example: /api/v1/files/1a7f3f7c-8b1e-4c2e-9f24-2b6d0b1c5e11

    Application:
      type: object
      required:
        [
          id,
          vacancyId,
          vacancyTitle,
          startupId,
          startupTitle,
          startupLogoUrl,
          applicant,
          motivation,
          files,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
          example: a-77
        vacancyId:
          type: string
          example: v-1
        vacancyTitle:
          type: string
          example: ML Engineer
        startupId:
          type: string
          example: s-1
        startupTitle:
          type: string
          example: NeuroPilot AI
        startupLogoUrl:
          type: string
          nullable: true
          example: null
        applicant:
          $ref: '#/components/schemas/Applicant'
        motivation:
          type: string
          description: Мотивационное письмо (не пустое).
          example: Три года в NLP, есть опыт клинических текстов.
        files:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ApplicationFile'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T09:10:00.000Z'

    ApplyInput:
      type: object
      required: [motivation, files]
      properties:
        motivation:
          type: string
          minLength: 1
          description: После `trim()` не должен быть пустым.
          example: Три года в NLP, есть опыт клинических текстов и разметки данных.
        files:
          type: array
          maxItems: 5
          description: |
            Ранее загруженные объекты со `scope = application-attachment`.
            Клиентские `name`/`size`/`url` игнорируются — backend берёт их из индекса хранилища.
          items:
            $ref: '#/components/schemas/ApplicationFile'

    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResult'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Application'

    # ── Статистика ─────────────────────────────────────────────────────────────
    DailyActivityPoint:
      type: object
      required: [date, views, applications]
      properties:
        date:
          type: string
          format: date
          description: Календарный день (UTC), `YYYY-MM-DD`.
          example: '2026-10-20'
        views:
          type: integer
          minimum: 0
          example: 21
        applications:
          type: integer
          minimum: 0
          example: 0

    VacancyViewer:
      type: object
      required: [user, viewedAt]
      properties:
        user:
          $ref: '#/components/schemas/Applicant'
        viewedAt:
          type: string
          format: date-time
          example: '2026-10-20T18:42:00.000Z'

    VacancyStats:
      type: object
      required:
        [
          vacancyId,
          vacancyTitle,
          startupTitle,
          startupLogoUrl,
          totalViews,
          totalApplications,
          daily,
          viewers,
          applications,
        ]
      properties:
        vacancyId:
          type: string
          example: v-1
        vacancyTitle:
          type: string
          example: ML Engineer
        startupTitle:
          type: string
          example: NeuroPilot AI
        startupLogoUrl:
          type: string
          nullable: true
          example: null
        totalViews:
          type: integer
          minimum: 0
          description: Все уникальные просмотры за всё время.
          example: 940
        totalApplications:
          type: integer
          minimum: 0
          example: 8
        daily:
          type: array
          description: Ровно 14 точек, по возрастанию даты, включая сегодня (UTC).
          minItems: 14
          maxItems: 14
          items:
            $ref: '#/components/schemas/DailyActivityPoint'
        viewers:
          type: array
          description: До 20 последних просмотров, по убыванию `viewedAt`.
          maxItems: 20
          items:
            $ref: '#/components/schemas/VacancyViewer'
        applications:
          type: array
          description: Все отклики вакансии, по убыванию `createdAt`.
          items:
            $ref: '#/components/schemas/Application'

    TrackViewResult:
      type: object
      required: [tracked]
      properties:
        tracked:
          type: boolean
          description: '`true` — просмотр создан; `false` — уже был сегодня.'
          example: true

    # ── Профиль ────────────────────────────────────────────────────────────────
    ProfileDashboard:
      type: object
      required: [user, recentStartups, myVacancies, myApplications, totals]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        recentStartups:
          type: array
          description: До 6 стартапов пользователя, по `updatedAt` DESC.
          maxItems: 6
          items:
            $ref: '#/components/schemas/StartupSummary'
        myVacancies:
          type: array
          description: До 5 вакансий, по откликам DESC, затем по просмотрам DESC.
          maxItems: 5
          items:
            $ref: '#/components/schemas/VacancyListItem'
        myApplications:
          type: array
          description: До 5 последних откликов пользователя.
          maxItems: 5
          items:
            $ref: '#/components/schemas/Application'
        totals:
          type: object
          required: [startups, vacancies, applications]
          properties:
            startups:
              type: integer
              minimum: 0
              example: 1
            vacancies:
              type: integer
              minimum: 0
              example: 3
            applications:
              type: integer
              minimum: 0
              example: 2

    # ── Файлы ──────────────────────────────────────────────────────────────────
    FileUploadScope:
      type: string
      description: |
        Политика хранения и валидации. Неизвестное значение сервер трактует как
        `application-attachment` (мягкая деградация, как в mock).
      enum: [startup-logo, application-attachment]
      example: startup-logo

    StoredFile:
      type: object
      description: Дескриптор объекта в хранилище.
      required: [id, name, size, mimeType, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Ключ объекта, сгенерированный сервером.
          example: 6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
        name:
          type: string
          description: Исходное имя файла (метаданные, не путь).
          example: neuropilot-logo.png
        size:
          type: integer
          description: Размер в байтах.
          example: 48120
        mimeType:
          type: string
          example: image/png
        url:
          type: string
          description: Same-origin URL через прокси backend.
          example: /api/v1/files/6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T21:00:00.000Z'

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          example: true
