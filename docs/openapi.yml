openapi: 3.0.3

info:
  title: Business Club · Hiring Platform API
  version: 1.0.0
  description: |
    Backend contract for the Business Club hiring **Telegram Mini App**.

    # Назначение

    Спецификация описывает **минимально необходимый набор эндпойнтов**, который должен реализовать
    backend, чтобы фронтенд (`frontend/`, React SPA, запускаемый внутри Telegram) работал без
    изменений.

    Источники истины, из которых собрана эта спецификация:
      - `frontend/src/types/*.ts` — транспортные типы (request/response);
      - `frontend/src/telegram/webApp.ts` — источник `initData` и обёртка над `Telegram.WebApp`;
      - `frontend/src/api/mock/server.ts` — маршруты и семантика in-browser mock-сервера;
      - `frontend/src/api/files.ts` и `frontend/src/api/mock/files.ts` — политика файлового хранилища;
      - `frontend/vite.config.ts`, `frontend/nginx.conf`, `docker-compose.yml` — префиксы и проксирование;
      - `docs/database/erd.puml` — ограничения полей и словари значений.

    # Базовый путь

    Платформенный контракт публикуется под `/api/v1`. Vite dev-proxy и nginx (`location /api/`)
    передают запрос в backend; backend обязан обслуживать `/api/v1` и сохранять обратную
    совместимость с `/api`. Ниже пути указаны относительно `servers[].url`.

    # Аутентификация: Telegram Mini App

    Приложение **не имеет** формы логина, пароля, OAuth-редиректов и внешнего IdP
    (Keycloak и подобные не используются). Единственный источник идентичности — строка
    `Telegram.WebApp.initData`, подписанная ботом:

      1. клиент отправляет `POST /auth/telegram` с `{ "initData": "<сырая строка>" }`;
      2. backend проверяет HMAC-SHA256 (`TELEGRAM_BOT_TOKEN`, ключ `WebAppData`), свежесть
         `auth_date` (по умолчанию ≤ 86400 с) и однократность подписи (`hash` / `query_id`);
      3. выполняется upsert по `telegram_id`, выдаётся сессия: HttpOnly-cookie `hb_session`
         (`Secure; SameSite=Lax; Path=/`) и/или заголовок `X-Telegram-Init-Data` на каждый запрос;
      4. `401` возвращается только как JSON `{ "message": ... }` — **никогда** как `302` на IdP;
         при `401` клиент считает `initData` недействительным и требует перезапуска Mini App.

    Демо/mock-режим (`VITE_USE_MOCK=1`) не является отдельным способом авторизации: он проходит
    тот же маршрут `/auth/telegram` с заглушкой, поэтому UI-ветки совпадают с production.

    Владелец ресурса определяется **только** по аутентифицированному пользователю — никогда по
    телу запроса или query-параметру.

    # Формат данных

      - Идентификаторы — UUID. В примерах ниже используются короткие читаемые значения
        (`s-1`, `v-1`, `u-anna`) — идентификатор считается **непрозрачной строкой**, поэтому
        `format: uuid` в спецификации не навязывается.
      - Даты и время — ISO 8601 UTC (`2026-10-20T18:24:00.000Z`), даты без времени — `YYYY-MM-DD`.
      - Денежные суммы и вознаграждение — свободный текст (`"от 250 000 ₽, опционы"`), не число.
      - Все списки — объект пагинации `{ items, total, page, pageSize }`.
      - Ошибки — всегда `{ "message": "<текст для пользователя>" }`, текст показывается в UI как есть.
      - Профиль пользователя содержит только данные Telegram: `telegramId`, `firstName`,
        `lastName`, `photoUrl`. Ник, email, должность и компания не хранятся и не возвращаются.

    # Пагинация

    `page` — 1-based. `pageSize` по умолчанию: 6 для стартапов и вакансий, 10 для откликов.
    Максимум — 100 (фронтенд запрашивает `pageSize=100`, чтобы получить «все» свои вакансии).
    Некорректные или неположительные значения трактуются как значения по умолчанию.

    # Файлы

    Браузер **никогда** не обращается к dufs напрямую. Backend — единственный клиент хранилища и
    отвечает за:
      - авторизацию (кто может читать/удалять объект);
      - валидацию (размер, MIME, количество);
      - генерацию ключа объекта (UUID, имя файла — только метаданные);
      - проксирование PUT/GET/DELETE в dufs.

    Публичный URL объекта всегда строится от `PUBLIC_BASE_URL` и имеет вид
    `/api/v1/files/{uuid}`. Клиентские URL-ы (например, `logoUrl` при сохранении стартапа)
    принимаются только как **ссылка на уже загруженный объект**: backend извлекает UUID,
    проверяет владельца и `scope`, а не сохраняет строку как есть.

    Аватары пользователей не проксируются: `photoUrl` — это `photo_url` из Telegram, внешняя
    ссылка на CDN Telegram. `X-Telegram-Init-Data` и cookie к ней не применяются.

    # Совместимость с mock-сервером

    Mock включается **только** через `VITE_USE_MOCK=1` (см. `frontend/src/api/client.ts`); по
    умолчанию SPA работает с реальным backend. Mock реализует те же маршруты, включая
    `POST /auth/telegram`, поэтому UI-ветки авторизации совпадают. Особые случаи, воспроизведённые
    намеренно:
      - `POST /vacancies/{id}/view` идемпотентен в пределах календарного дня (UTC);
      - `GET /files/{id}` в демо-режиме отдаёт `410 Gone`, если байты не сохранились между перезагрузками;
      - превышение общего бюджета хранилища — `507 Insufficient Storage`.

    # Окружение backend

    Обязательные переменные:
      - `TELEGRAM_BOT_TOKEN` — секрет бота, только на сервере (никогда в бандле SPA);
      - `INIT_DATA_MAX_AGE` — допустимый возраст `auth_date`, по умолчанию `86400`;
      - `SESSION_TTL` — время жизни cookie `hb_session`, по умолчанию `86400`;
      - `SESSION_SECRET` — ключ подписи сессии (если cookie подписывается JWT/itsdangerous);
      - `PUBLIC_BASE_URL` — база для сборки `url`/`logoUrl` (`{PUBLIC_BASE_URL}/api/v1/files/{uuid}`);
      - `CORS_ALLOWED_ORIGINS` — точный origin Mini App; при cookie обязательны
        `Access-Control-Allow-Credentials: true` и явный origin (никогда `*`).

  contact:
    name: Hiring Platform backend team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: |
      Production / платформенный контракт (см. `VITE_API_URL` в `docker-compose.yml`).
  - url: /api
    description: |
      Обратная совместимость: Vite dev-proxy (`vite.config.ts`) и nginx `location /api/`.

security:
  # Любой из двух механизмов достаточен. Клиент отправляет оба: cookie нужен
  # для `<img src>` и скачивания вложений, заголовок — для остальных запросов.
  - telegramInitData: []
  - sessionCookie: []

tags:
  - name: Auth
    description: |
      Аутентификация Telegram Mini App. `POST /auth/telegram` обменивает подписанный `initData`
      на серверную сессию, `GET /auth/me` отдаёт текущего пользователя для шапки и проверки
      владения стартапом/вакансией.
  - name: Profile
    description: |
      Личный кабинет: агрегированный дашборд и списки «моих» сущностей. Эти эндпойнты нужны, чтобы
      отрисовать профиль одним запросом и не собирать статистику на клиенте.
  - name: Startups
    description: |
      Каталог стартапов и редактирование собственного стартапа вместе с его вакансиями.
      Вакансии входят в payload стартапа: сохранение выполняется одним атомарным запросом.
  - name: Vacancies
    description: |
      Каталог вакансий, карточка вакансии, справочники (названия и шаблоны), трекинг просмотров,
      отклик и статистика для владельца.
  - name: Applications
    description: |
      Отклики соискателя («мои») и входящие отклики владельца стартапа («инбокс»),
      а также модерация статуса.
  - name: Files
    description: |
      Прокси файлового хранилища (dufs). Загрузка логотипов стартапов и вложений к откликам,
      чтение и удаление объектов по UUID.

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────────────────────────────────────
  /auth/telegram:
    post:
      tags: [Auth]
      operationId: createTelegramSession
      summary: Обменять initData на сессию
      description: |
        Единственный вход в приложение. Принимает сырую строку `Telegram.WebApp.initData`
        (`query_id=...&user=<urlencoded json>&auth_date=...&hash=...`).

        Backend обязан:
          1. собрать `data_check_string` из всех полей кроме `hash`, отсортированных по имени;
          2. вычислить `HMAC-SHA256(secret_key, data_check_string)`, где
             `secret_key = HMAC-SHA256("WebAppData", TELEGRAM_BOT_TOKEN)`, и сравнить с `hash`
             в постоянном времени;
          3. проверить `auth_date`: `now - auth_date <= INIT_DATA_MAX_AGE` (по умолчанию 86400 с);
          4. зафиксировать хэш подписи (`hash`, либо `query_id` при наличии) в
             `telegram_auth_nonces`, чтобы предотвратить повторное использование
             той же строки (replay protection);
          5. выполнить upsert пользователя по `telegram_id` и обновить `first_name`, `last_name`,
             `photo_url` из Telegram (ник/email/должность/компания не запрашиваются и не хранятся);
          6. создать сессию и вернуть `Set-Cookie: hb_session=...; HttpOnly; Secure; SameSite=Lax; Path=/`.

        После успеха фронтенд рендерит приложение; до этого запросы не отправляются.
      security: []
      x-frontend:
        hook: useTelegramAuth
        file: frontend/src/features/auth/api/useTelegramAuth.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  maxLength: 8192
                  description: Поле `window.Telegram.WebApp.initData` без изменений.
                  example: 'query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A279058397%2C%22first_name%22%3A%22%D0%90%D0%BD%D0%BD%D0%B0%22%7D&auth_date=1761000000&hash=8f5c1b0f9a1e...'
      responses:
        '200':
          description: Сессия создана
          headers:
            Set-Cookie:
              description: HttpOnly-сессия; именно она авторизует `<img src>` и скачивание файлов.
              schema:
                type: string
              example: hb_session=eyJ...; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramSession'
              examples:
                authorized:
                  summary: Пользователь вошёл
                  value:
                    user:
                      id: u-anna
                      telegramId: 279058397
                      firstName: Анна
                      lastName: Смирнова
                      photoUrl: https://t.me/i/userpic/320/anna.jpg
                      startupsCount: 1
                      vacanciesCount: 3
                      applicationsCount: 2
                    expiresAt: '2026-10-22T08:00:00.000Z'
        '401':
          description: |
            `initData` отсутствует, подпись не совпала, `auth_date` просрочен или строка
            уже была использована ранее. Ответ — всегда JSON, без редиректов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noInitData:
                  value:
                    message: Откройте приложение через Telegram
                badSignature:
                  value:
                    message: Не удалось проверить данные Telegram
                expired:
                  value:
                    message: Сессия Telegram истекла, откройте приложение заново
        '403':
          description: Пользователь заблокирован (`users.is_active = false`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                blocked:
                  value:
                    message: Доступ к приложению закрыт
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Текущий пользователь
      description: |
        Усечённый профиль (`Applicant`) без счётчиков. Данные берутся из сессии, а не из тела
        запроса. Используется в шапке и для определения `isOwner` на страницах стартапа и вакансии.
      x-frontend:
        hook: useCurrentUser
        file: frontend/src/features/auth/api/useCurrentUser.ts
        cache: 'staleTime: 5 минут; при 401 приложение требует перезапуска Mini App'
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Applicant'
              examples:
                currentUser:
                  summary: Пользователь из Telegram
                  value:
                    id: u-anna
                    telegramId: 279058397
                    firstName: Анна
                    lastName: Смирнова
                    photoUrl: https://t.me/i/userpic/320/anna.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────────────────────────────────────
  # Profile
  # ─────────────────────────────────────────────────────────────────────────────
  /profile/dashboard:
    get:
      tags: [Profile]
      operationId: getProfileDashboard
      summary: Дашборд личного кабинета
      description: |
        Один запрос отдаёт всё, что нужно главной странице профиля:
          - `user` — полный профиль со счётчиками;
          - `recentStartups` — до 6 последних изменённых стартапов пользователя;
          - `myVacancies` — до 5 вакансий пользователя, отсортированных по откликам, затем по просмотрам;
          - `myApplications` — до 5 последних откликов пользователя;
          - `totals` — счётчики для верхних плиток.

        `totals` обязан совпадать с `user.startupsCount` / `user.vacanciesCount` / `user.applicationsCount`.
      x-frontend:
        hook: useProfileDashboard
        file: frontend/src/features/profile/api/useProfileDashboard.ts
      responses:
        '200':
          description: Агрегированный дашборд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDashboard'
              examples:
                dashboard:
                  summary: Профиль с активностью
                  value:
                    user:
                      id: u-anna
                      firstName: Анна
                      lastName: Ковалёва
                      photoUrl: null
                      startupsCount: 1
                      vacanciesCount: 3
                      applicationsCount: 2
                    recentStartups:
                      - id: s-1
                        title: NeuroPilot AI
                        logoUrl: /api/v1/files/6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40
                        stage: mvp
                        shortDescription: ИИ-ассистент для первичной диагностики в клиниках.
                        owner:
                          id: u-anna
                          firstName: Анна
                          lastName: Ковалёва
                          photoUrl: null
                        createdAt: '2026-07-16T09:00:00.000Z'
                        updatedAt: '2026-10-18T12:31:00.000Z'
                        vacanciesCount: 3
                        applicationsCount: 14
                        viewsCount: 1860
                    myVacancies:
                      - id: v-1
                        startupId: s-1
                        startupTitle: NeuroPilot AI
                        startupLogoUrl: null
                        title: ML Engineer
                        applicationsCount: 8
                        viewsCount: 940
                        isHidden: false
                        createdAt: '2026-07-20T10:00:00.000Z'
                    myApplications:
                      - id: a-1
                        vacancyId: v-9
                        vacancyTitle: Data Analyst
                        startupId: s-4
                        startupTitle: FinPulse
                        startupLogoUrl: null
                        applicant:
                          id: u-anna
                          firstName: Анна
                          lastName: Ковалёва
                          photoUrl: null
                        motivation: Хочу применить опыт продуктовой аналитики в финтехе.
                        files: []
                        status: pending
                        createdAt: '2026-10-02T14:05:00.000Z'
                    totals:
                      startups: 1
                      vacancies: 3
                      applications: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /profile/startups:
    get:
      tags: [Profile]
      operationId: listOwnedStartups
      summary: Все стартапы пользователя
      description: |
        Полный список стартапов, где `owner.id == currentUser.id`, отсортированный по `updatedAt` по убыванию.
        Пагинации нет: список используется на странице «Мои стартапы» и в селекторах редактора.
        Для чужих стартапов используйте `GET /startups`.
      x-frontend:
        hook: useOwnedStartups
        file: frontend/src/features/profile/api/useProfileLists.ts
      responses:
        '200':
          description: Массив стартапов (без вложенных вакансий)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StartupSummary'
              examples:
                twoStartups:
                  summary: Два проекта
                  value:
                    - id: s-1
                      title: NeuroPilot AI
                      logoUrl: null
                      stage: mvp
                      shortDescription: ИИ-ассистент для первичной диагностики в клиниках.
                      owner:
                        id: u-anna
                        firstName: Анна
                        lastName: Ковалёва
                        photoUrl: null
                      createdAt: '2026-07-16T09:00:00.000Z'
                      updatedAt: '2026-10-18T12:31:00.000Z'
                      vacanciesCount: 3
                      applicationsCount: 14
                      viewsCount: 1860
                    - id: s-7
                      title: SkillBridge
                      logoUrl: null
                      stage: idea
                      shortDescription: Менторская платформа для Junior-разработчиков.
                      owner:
                        id: u-anna
                        firstName: Анна
                        lastName: Ковалёва
                        photoUrl: null
                      createdAt: '2026-10-01T08:15:00.000Z'
                      updatedAt: '2026-10-11T16:40:00.000Z'
                      vacanciesCount: 0
                      applicationsCount: 0
                      viewsCount: 0
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────────────────────────────────────
  # Startups
  # ─────────────────────────────────────────────────────────────────────────────
  /startups:
    get:
      tags: [Startups]
      operationId: listStartups
      summary: Каталог стартапов
      description: |
        Поиск по `title`, `shortDescription` и `description` (регистронезависимый, подстрока).
        Сортировка всегда `updatedAt DESC` (сначала недавно обновлённые).

        `ownerId` принимает **UUID пользователя**. Сентинел `me` здесь не поддерживается —
        для «своих» стартапов используйте `GET /profile/startups`.
      x-frontend:
        hook: useStartupList
        file: frontend/src/features/startups/api/useStartups.ts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          required: false
          description: Подстрока для поиска по названию и описаниям (обрезается по краям).
          schema:
            type: string
            maxLength: 200
          example: нейро
        - name: ownerId
          in: query
          required: false
          description: UUID владельца; фильтр по конкретному автору.
          schema:
            type: string
            format: uuid
          example: u-anna
      responses:
        '200':
          description: Страница стартапов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupPage'
              examples:
                firstPage:
                  summary: Первая страница каталога
                  value:
                    items:
                      - id: s-1
                        title: NeuroPilot AI
                        logoUrl: '/api/v1/files/6f1c2c0e-6a2f-4d7b-9a51-8f3a2d1b9c40'
                        stage: mvp
                        shortDescription: ИИ-ассистент для первичной диагностики в клиниках.
                        owner:
                          id: u-anna
                          firstName: Анна
                          lastName: Ковалёва
                          photoUrl: null
                        createdAt: '2026-07-16T09:00:00.000Z'
                        updatedAt: '2026-10-18T12:31:00.000Z'
                        vacanciesCount: 3
                        applicationsCount: 14
                        viewsCount: 1860
                    total: 12
                    page: 1
                    pageSize: 6
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Startups]
      operationId: createStartup
      summary: Создать стартап
      description: |
        Создаёт стартап текущего пользователя и **все переданные вакансии** в одной транзакции.
        Владелец берётся из токена и не передаётся в теле.

        Правила:
          - `logoUrl` обязателен и может быть `null` — это осознанное значение «логотипа нет»,
            backend не должен подставлять плейсхолдер;
          - при `vacancies[].title == ""` backend подставляет название первой вакансии
            (или `«Команда проекта»`, если вакансий нет);
          - `id` в `VacancyInput` при создании игнорируется;
