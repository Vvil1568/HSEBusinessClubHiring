      description: |
        Создаёт отклик со статусом `pending` от текущего пользователя.

        Валидация:
          - `motivation` не пустой после `trim()` → иначе `422`;
          - не более **5** вложений → иначе `422`;
          - каждый элемент `files[].id` обязан существовать в хранилище и иметь
            `scope = application-attachment` → иначе `422`;
          - `name`, `size`, `mimeType`, `url` из клиента **игнорируются**: backend берёт метаданные
            из индекса хранилища (клиент не может подделать имя или ссылку);
          - повторный отклик на ту же вакансию → `409`; защищается уникальным ключом
            `applications (vacancy_id, applicant_id)`, а не только проверкой в коде (гонка двух
            одновременных запросов не создаёт дубль);
          - отклик на вакансию собственного стартапа → `422`: владелец не может откликнуться себе;
          - превышен общий бюджет хранилища → `507`.

        После успеха фронтенд инвалидирует карточку вакансии, каталог, отклики и профиль.
