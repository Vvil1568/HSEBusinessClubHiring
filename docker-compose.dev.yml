services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_db}
      POSTGRES_USER: ${POSTGRES_USER:-template_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-template_user} -d ${POSTGRES_DB:-template_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: app-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-template_user}:${POSTGRES_PASSWORD:-template_password}@postgres:5432/${POSTGRES_DB:-template_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      INIT_DATA_MAX_AGE: ${INIT_DATA_MAX_AGE:-86400}
      SESSION_TTL: ${SESSION_TTL:-86400}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      FILES_PUBLIC_PREFIX: /api/v1/files
      STORAGE_BACKEND: dufs
      DUFS_BASE_URL: http://dufs:5000
      DUFS_AUTH: ${DUFS_AUTH:-}
      STORAGE_BUDGET_BYTES: ${STORAGE_BUDGET_BYTES:-536870912}
    depends_on:
      postgres:
        condition: service_healthy
      dufs:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: /api/v1
        VITE_USE_MOCK: '0'
    container_name: app-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - app-network

  dufs:
    image: sigoden/dufs:latest
    container_name: app-dufs-dev
    restart: unless-stopped
    volumes:
      - ./data/uploads:/data
    environment:
      # Backend authenticates to dufs with these credentials over the internal
      # network only; they are never exposed to the client bundle.
      DUFS_AUTH: ${DUFS_AUTH:-}
    command: >
      /data
      --allow-upload
      --allow-delete
      --allow-search
      --hidden "*"
      --render-index
    networks:
      - app-network
networks:
  app-network:
    name: app-dev-network
    driver: bridge